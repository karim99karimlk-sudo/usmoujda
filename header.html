<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@200..1000&family=Oi&display=swap" rel="stylesheet">

<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<title>USMO Header</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: "Cairo", sans-serif;
    background: #ececec;
    height: 2000px;
    /* Base padding for desktop (95px header + 35px topbar) */
    padding-top: 130px; 
    transition: padding-top 0.35s ease;
}

/* Added class for when scrolling down on desktop */
body.scrolled {
    padding-top: 95px;
}

/*==========================
HEADER CONTAINER
==========================*/

.header-container {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    z-index: 1000;
}

.menu-btn,
.close-btn {
    display: none;
    cursor: pointer;
}

/*==========================
TOP BAR
==========================*/

.top-bar {
    height: 35px;
    background: #000;
    display: flex;
    justify-content: flex-start;
    align-items: center;
    padding: 0 50px;
    overflow: hidden;
    transition: height .35s ease, padding .35s ease;
}

.top-bar.hide {
    height: 0;
    padding-top: 0;
    padding-bottom: 0;
}

.social-icons {
    display: flex;
    gap: 18px;
}

.social-icons a {
    color: #fff;
    font-size: 15px;
    transition: .3s;
}

.social-icons a:hover {
    color: #bdbdbd;
}

/*==========================
HEADER
==========================*/

header {
    position: relative;
    height: 95px;
    background: #fff;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 50px;
    box-shadow: 0 5px 15px rgba(0,0,0,.08);
    overflow: hidden;
}

.logo a {
    text-decoration: none;
    color: #000;
    font-family: "Oi";
    font-size: 32px;
}

nav {
    flex: 1;
    display: flex;
    justify-content: center;
}

nav ul {
    display: flex;
    list-style: none;
    gap: 55px;
}

nav a {
    text-decoration: none;
    color: #000;
    font-size: 18px;
    font-weight: 600;
    position: relative;
}

nav a::after {
    content: "";
    position: absolute;
    bottom: -6px;
    right: 0;
    width: 0;
    height: 2px;
    background: #000;
    transition: .3s;
}

nav a:hover::after {
    width: 100%;
}

/*==========================
BADGE
==========================*/

.badge {
    position: absolute;
    left: 40px;
    top: -8px;
}

.badge img {
    height: 200px;
    border-radius: 50%;
    box-shadow: 0 0 10px rgba(0,0,0,.4);
    transform: rotate(10deg);
}

/*==========================
RESPONSIVE
==========================*/
@media(max-width: 900px) {

    body {
        /* Base padding for mobile (80px header + 35px topbar) */
        padding-top: 115px;
    }
    
    /* Added class for when scrolling down on mobile */
    body.scrolled {
        padding-top: 80px; 
    }

    .top-bar {
        padding: 0 20px;
    }

    header {
        height: 80px;
        padding: 0 20px;
    }

    .logo a {
        font-size: 24px;
    }

    /* Hamburger */
    .menu-btn {
        display: block;
        font-size: 30px;
        color: #000;
        z-index: 1002;
    }

    /* Mobile Menu */
    nav {
        position: fixed;
        top: 0;
        right: -100%;
        width: 85%;
        height: 100vh;
        background: #fff;
        display: flex;
        justify-content: center;
        align-items: center;
        transition: .4s;
        box-shadow: -5px 0 15px rgba(0,0,0,.15);
        z-index: 1001;
    }

    nav.active {
        right: 0;
    }

    .close-btn {
        display: block;
        position: absolute;
        top: 25px;
        left: 25px;
        font-size: 30px;
    }

    nav ul {
        flex-direction: column;
        gap: 35px;
    }

    nav a {
        font-size: 22px;
    }

    .badge {
        display: none;
    }

}
</style>
</head>
<body>

<div class="header-container">

    <!-- Top Bar -->
    <div class="top-bar">
        <div class="social-icons">
            <a href="#"><i class="fab fa-facebook-f"></i></a>
            <a href="#"><i class="fab fa-instagram"></i></a>
            <a href="#"><i class="fab fa-x-twitter"></i></a>
            <a href="#"><i class="fab fa-youtube"></i></a>
            <a href="#"><i class="fab fa-tiktok"></i></a>
        </div>
    </div>

    <!-- Header -->
    <header>
        <div class="logo">
            <a href="index.html">الإتحاد</a>
        </div>
         
        <i class="fa-solid fa-bars menu-btn" id="menu-btn"></i>

        <!-- FIX: Added id="nav" so the JavaScript can find it -->
        <nav id="nav">
            <i class="fa-solid fa-xmark close-btn" id="close-btn"></i>
            <ul>
                <li><a href="index.html">الرئيسية</a></li>
                <li><a href="school.html">المدرسة</a></li>
                <li><a href="history.html">التاريخ</a></li>
                <li><a href="team.html">الفريق</a></li>
                <li><a href="schedule.html">الجدول</a></li>
                <li><a href="ranking.html">الترتيب</a></li>
            </ul>
        </nav>

        <div class="badge">
            <img src="USMO IMG/logo/cropped_circle_image.png" alt="">
        </div>
    </header>

</div>

<script>
const topBar = document.querySelector(".top-bar");
let lastScroll = 0;

// FIX: Instead of hardcoding px values in JS (which breaks responsive design),
// we toggle a class on the body and let CSS handle the specific padding values via media queries.
window.addEventListener("scroll", () => {
    let currentScroll = window.scrollY;

    if (currentScroll <= 0) {
        topBar.classList.remove("hide");
        document.body.classList.remove("scrolled");
    } else if (currentScroll > lastScroll) {
        topBar.classList.add("hide");
        document.body.classList.add("scrolled");
    } else {
        topBar.classList.remove("hide");
        document.body.classList.remove("scrolled");
    }

    lastScroll = currentScroll;
});

const menuBtn = document.getElementById("menu-btn");
const closeBtn = document.getElementById("close-btn");
const nav = document.getElementById("nav");

menuBtn.onclick = () => {
    nav.classList.add("active");
}

closeBtn.onclick = () => {
    nav.classList.remove("active");
}

document.querySelectorAll("#nav a").forEach(link => {
    link.onclick = () => {
        nav.classList.remove("active");
    }
});
</script>

</body>
</html>
